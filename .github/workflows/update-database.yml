# Rebuilds the app databases from the latest Hitchwiki dumps and the Hitchhiking Rides Dataset and publishes
# them for the app to download. One database per guide language, built one after another:
#   en  English (the app also bundles a copy). Dump, in order: the "dump_url" input, the repository
#       variable HITCHWIKI_DUMP_URL, or a file uploaded to a release tagged "dump-source".
#   pl  Polish (downloaded when the user picks it). Dump: the "dump_url_pl" input, the variable
#       HITCHWIKI_DUMP_URL_PL, or https://dumps.hitchwiki.org/hitchwiki-current-pl.xml.gz
#   spots  Hitchhiking spots with ratings, waits and comments, the same for every language (the app also bundles
#       a copy). Built from rides.parquet, published weekly by maps.hitchwiki.org on Hugging Face
#       (the "rides_url" input overrides it). The result is an ODbL database, so it is also published as a
#       plain hitchspots.sqlite.gz for anyone to download, as the ODbL's share-alike asks.
#
# Runs every Monday and can be started by hand (Actions tab -> Update Hitchwiki database -> Run workflow).
# Free on public repositories.
#
# Output: release "database-latest" with
#   manifest.json      + hitchwiki-<version>.sqlite.deflate      (English)
#   manifest-pl.json   + hitchwiki-pl-<version>.sqlite.deflate   (Polish)
#   manifest-spots.json + hitchspots-<version>.sqlite.deflate    (spots), plus hitchspots.sqlite.gz
# The app reads https://github.com/<owner>/<repo>/releases/download/database-latest/manifest[-pl|-spots].json

name: Update Hitchwiki database

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      languages:
        description: 'Which databases to build'
        type: choice
        options: [all, en, pl, spots]
        default: all
      dump_url:
        description: 'English dump URL (overrides the HITCHWIKI_DUMP_URL variable)'
        required: false
        default: ''
      dump_url_pl:
        description: 'Polish dump URL (overrides HITCHWIKI_DUMP_URL_PL and the default)'
        required: false
        default: ''
      rides_url:
        description: 'rides.parquet URL for the spots (overrides the Hugging Face default)'
        required: false
        default: ''
      force:
        description: 'Publish even if the dump has not changed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-database
  cancel-in-progress: false

env:
  RELEASE_TAG: database-latest
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    if: inputs.languages != 'spots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One at a time: both upload to the same release.
      max-parallel: 1
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages == 'en' && '["en"]' || inputs.languages == 'pl' && '["pl"]' || '["en","pl"]') }}
    env:
      LANGUAGE: ${{ matrix.language }}
      # English keeps the original file names, so app versions without language support keep working.
      SUFFIX: ${{ matrix.language != 'en' && format('-{0}', matrix.language) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        # babel: country names per language, for wikis without infoboxes (Polish)
        run: pip install mwparserfromhell==0.7.2 mwxml==0.3.8 babel==2.16.0

      - name: Download dump
        id: dump
        env:
          DUMP_URL_EN: ${{ inputs.dump_url || vars.HITCHWIKI_DUMP_URL }}
          DUMP_URL_PL: ${{ inputs.dump_url_pl || vars.HITCHWIKI_DUMP_URL_PL || 'https://dumps.hitchwiki.org/hitchwiki-current-pl.xml.gz' }}
        run: |
          set -euo pipefail
          mkdir -p work
          if [ "$LANGUAGE" = "en" ]; then DUMP_URL="${DUMP_URL_EN}"; else DUMP_URL="${DUMP_URL_PL}"; fi
          if [ -z "${DUMP_URL}" ] && [ "$LANGUAGE" != "en" ]; then
            echo "::error::No dump URL for ${LANGUAGE}"; exit 1
          fi
          if [ -n "${DUMP_URL}" ]; then
            echo "Downloading ${DUMP_URL}"
            curl -fL --retry 3 --retry-delay 10 \
              -A "HitchWiseDatabaseBuilder/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
              -o work/dump.download "${DUMP_URL}"
          else
            echo "No dump URL set: using the file uploaded to the dump-source release"
            gh release download dump-source --dir work/source
            mv "$(ls -S work/source/* | head -n 1)" work/dump.download
          fi
          case "$(file -b --mime-type work/dump.download)" in
            application/gzip|application/x-gzip) gunzip -c work/dump.download > work/dump.xml ;;
            application/x-bzip2) bunzip2 -c work/dump.download > work/dump.xml ;;
            application/x-7z-compressed)
              command -v 7z > /dev/null || sudo apt-get install -y p7zip-full
              7z x -so work/dump.download > work/dump.xml ;;
            *) mv work/dump.download work/dump.xml ;;
          esac
          rm -f work/dump.download
          if ! head -c 2000 work/dump.xml | grep -q '<mediawiki'; then
            echo "::error::The download is not a MediaWiki XML dump (blocked by bot protection or a wrong URL?)"
            head -c 500 work/dump.xml
            exit 1
          fi
          echo "Dump (${LANGUAGE}): $(du -h work/dump.xml | cut -f1)"
          echo "sha256=$(sha256sum work/dump.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Compare with the published database
        id: previous
        run: |
          gh release download "$RELEASE_TAG" --pattern "manifest${SUFFIX}.json" --output work/previous.json 2>/dev/null || echo '{}' > work/previous.json
          previous=$(python3 -c "import json; print(json.load(open('work/previous.json')).get('source_sha256', ''))")
          # Every build gets a higher version than the last one, so apps also pick up a rebuild of the same
          # dump with an improved parser (published with "force").
          echo "min_version=$(python3 -c "import json; print(int(json.load(open('work/previous.json')).get('version', 0)) + 1)")" >> "$GITHUB_OUTPUT"
          if [ "$previous" = "${{ steps.dump.outputs.sha256 }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Dump unchanged since the last build: nothing to publish."
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build database
        if: steps.previous.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          python3 tools/slim_dump.py work/dump.xml work/hitchwiki-latest.xml
          # Other languages borrow city positions from the English database bundled in the repo.
          gazetteer=()
          if [ "$LANGUAGE" != "en" ]; then gazetteer=(--gazetteer HitchWiki/hitchwiki.sqlite); fi
          python3 tools/extract.py work/hitchwiki-latest.xml work/output --language "$LANGUAGE" "${gazetteer[@]}" \
            --min-version "${{ steps.previous.outputs.min_version }}" \
            --app-db work/hitchwiki.sqlite --source-sha256 "${{ steps.dump.outputs.sha256 }}"
          python3 tools/package_database.py work/hitchwiki.sqlite work/publish --language "$LANGUAGE" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

      - name: Publish
        if: steps.previous.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Hitchwiki database" --latest=false \
              --notes "Databases the app downloads. Rebuilt weekly from the Hitchwiki dumps by .github/workflows/update-database.yml."
          fi
          database=$(basename work/publish/*.sqlite.deflate)
          # Database first, then the manifest that points at it, so the app never sees a manifest for a missing file.
          gh release upload "$RELEASE_TAG" "work/publish/${database}" --clobber
          gh release upload "$RELEASE_TAG" "work/publish/manifest${SUFFIX}.json" --clobber
          # Keep this language's new database and the previous one (for apps that fetched the old manifest
          # moments ago); delete anything older. Names contain the version, so they sort oldest first.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | { grep -E "^hitchwiki${SUFFIX}-[0-9]+\.sqlite\.deflate$" || true; } | { grep -v -Fx "${database}" || true; } \
            | sort | head -n -1 \
            | while read -r old; do gh release delete-asset "$RELEASE_TAG" "$old" --yes; done
          cat "work/publish/manifest${SUFFIX}.json" >> "$GITHUB_STEP_SUMMARY"

  spots:
    # After the guides (they upload to the same release), whether or not they succeeded.
    needs: build
    if: always() && (inputs.languages == '' || inputs.languages == null || inputs.languages == 'all' || inputs.languages == 'spots')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIDES_URL: ${{ inputs.rides_url || 'https://huggingface.co/datasets/Hitchwiki/hitchhiking-rides-dataset/resolve/main/rides.parquet' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parquet reader
        run: pip install pyarrow==17.0.0

      - name: Download rides dataset
        id: rides
        run: |
          set -euo pipefail
          mkdir -p work
          echo "Downloading ${RIDES_URL}"
          curl -fL --retry 3 --retry-delay 10 \
            -A "HitchWiseDatabaseBuilder/1.0 (+https://github.com/${GITHUB_REPOSITORY})" \
            -o work/rides.parquet "${RIDES_URL}"
          if [ "$(head -c 4 work/rides.parquet)" != "PAR1" ]; then
            echo "::error::The download is not a parquet file"
            head -c 500 work/rides.parquet
            exit 1
          fi
          echo "Rides dataset: $(du -h work/rides.parquet | cut -f1)"
          echo "sha256=$(sha256sum work/rides.parquet | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Compare with the published database
        id: previous
        run: |
          gh release download "$RELEASE_TAG" --pattern "manifest-spots.json" --output work/previous.json 2>/dev/null || echo '{}' > work/previous.json
          previous=$(python3 -c "import json; print(json.load(open('work/previous.json')).get('source_sha256', ''))")
          echo "min_version=$(python3 -c "import json; print(int(json.load(open('work/previous.json')).get('version', 0)) + 1)")" >> "$GITHUB_OUTPUT"
          if [ "$previous" = "${{ steps.rides.outputs.sha256 }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Rides dataset unchanged since the last build: nothing to publish."
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build database
        if: steps.previous.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          python3 tools/build_spots.py work/rides.parquet work/hitchspots.sqlite \
            --min-version "${{ steps.previous.outputs.min_version }}" --source-sha256 "${{ steps.rides.outputs.sha256 }}"
          python3 tools/package_database.py work/hitchspots.sqlite work/publish \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          # The plain database for anyone who wants the data (ODbL share-alike).
          gzip -9 -c work/hitchspots.sqlite > work/publish/hitchspots.sqlite.gz

      - name: Publish
        if: steps.previous.outputs.unchanged != 'true'
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Hitchwiki database" --latest=false \
              --notes "Databases the app downloads. Rebuilt weekly by .github/workflows/update-database.yml. hitchspots.sqlite.gz: hitchhiking spots from the Hitchhiking Rides Dataset (maps.hitchwiki.org, Hitchmap and contributors), Open Database License (ODbL) 1.0; comments CC BY-SA 4.0."
          fi
          database=$(basename work/publish/hitchspots-*.sqlite.deflate)
          # Database first, then the manifest that points at it, so the app never sees a manifest for a missing file.
          gh release upload "$RELEASE_TAG" "work/publish/${database}" work/publish/hitchspots.sqlite.gz --clobber
          gh release upload "$RELEASE_TAG" work/publish/manifest-spots.json --clobber
          # Keep the new database and the previous one; delete anything older.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | { grep -E "^hitchspots-[0-9]+\.sqlite\.deflate$" || true; } | { grep -v -Fx "${database}" || true; } \
            | sort | head -n -1 \
            | while read -r old; do gh release delete-asset "$RELEASE_TAG" "$old" --yes; done
          cat work/publish/manifest-spots.json >> "$GITHUB_STEP_SUMMARY"
